name: radar

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Run every source now"
        type: boolean
        default: false
  issues:
    types: [opened]

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write
  actions: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
    env:
      DASH_KEY: ${{ secrets.DASH_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
      SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
      RADAR_SYNC_TOKEN: ${{ secrets.RADAR_SYNC_TOKEN }}
      RESEND_FROM: ${{ vars.RESEND_FROM }}
      ALERT_TO: ${{ secrets.ALERT_TO }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DASHBOARD_URL: https://studio-kenotomia.com/madeline-jobs/
      CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - name: Restore state
        run: |
          mkdir -p state
          if git fetch --depth=1 origin state 2>/dev/null; then
            git show origin/state:state.enc > state/state.enc
            echo "restored $(wc -c < state/state.enc) bytes"
          else
            echo "no state branch yet"
          fi
          mkdir -p media
          if git fetch --depth=1 origin media 2>/dev/null; then
            git --work-tree=media checkout origin/media -- . && git reset -q
            echo "restored $(ls media | wc -l) media files"
          fi
          ls media > /tmp/media-before.txt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Unseal profile and photo
        run: python scripts/seal.py unseal
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Run cycle
        run: |
          MODE=full
          if [ "${{ github.event_name }}" = "issues" ]; then MODE=inbox; fi
          FORCE=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then FORCE="--force"; fi
          python run.py --primary --mode "$MODE" $FORCE --state state/state.enc --site site --media media
      - name: Assemble site
        run: |
          cp -R web/. site/
          touch site/.nojekyll
          printf 'User-agent: *\nDisallow: /\n' > site/robots.txt
          python - << 'PY'
          import json, os
          from pathlib import Path
          key = os.environ.get("DASH_KEY", "")
          if key:
              Path("site/unlock.js").write_text("export const KEY = " + json.dumps(key) + ";\n")
          PY
      - name: Save state
        run: |
          cd state
          git init -q -b state
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add state.enc
          git commit -qm "state $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" state:state
      - name: Save media
        run: |
          ls media > /tmp/media-after.txt
          if cmp -s /tmp/media-before.txt /tmp/media-after.txt; then echo "media unchanged"; exit 0; fi
          cd media
          git init -q -b media
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add -A
          git commit -qm "media $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" media:media
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
      - name: Keep the chain alive if GitHub's schedule stalls
        if: github.event_name != 'issues'
        run: |
          python - <<'PY'
          import json, os, subprocess, time, urllib.request
          from datetime import datetime, timezone
          repo, token = os.environ["GITHUB_REPOSITORY"], os.environ["GITHUB_TOKEN"]
          def api(path, method="GET", payload=None):
              req = urllib.request.Request(f"https://api.github.com/repos/{repo}{path}", method=method, data=json.dumps(payload).encode() if payload is not None else None,
                  headers={"Authorization": f"Bearer {token}", "Accept": "application/vnd.github+json", "Content-Type": "application/json"})
              with urllib.request.urlopen(req) as r:
                  body = r.read().decode(); return json.loads(body) if body else {}
          runs = api("/actions/workflows/radar.yml/runs?event=schedule&per_page=1").get("workflow_runs", [])
          last = datetime.fromisoformat(runs[0]["created_at"].replace("Z", "+00:00")) if runs else None
          stale = last is None or (datetime.now(timezone.utc) - last).total_seconds() > 1800
          active = [r for r in api("/actions/workflows/radar.yml/runs?status=queued&per_page=5").get("workflow_runs", [])]
          if stale and not active:
              time.sleep(300)
              api("/actions/workflows/radar.yml/dispatches", "POST", {"ref": "main", "inputs": {"force": "false"}})
              print("Schedule looks stalled; dispatched the next run.")
          else:
              print("Schedule is firing; no chain needed.")
          PY
